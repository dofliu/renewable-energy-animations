<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ep01.js｜海洋能系列</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e7eeec;
  --surface:#f6f9f8;
  --ink:#13232e;
  --muted:#4f6470;
  --line:#c5d3d2;
  --chart:#0e2a3b;
  --signal:#f2c230;
  --alert:#e8572a;
  --sea:#1f7f99;
  --stepdone:#1f7f99;
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Noto Sans TC","PingFang TC",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08202d;--surface:#0e2a3b;--ink:#e3ecee;--muted:#93aab4;--line:#1f4254;--stepdone:#58b8d0;--sea:#58b8d0;
  }
}
:root[data-theme="dark"]{--bg:#08202d;--surface:#0e2a3b;--ink:#e3ecee;--muted:#93aab4;--line:#1f4254;--stepdone:#58b8d0;--sea:#58b8d0;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:18px clamp(12px,3vw,32px) 48px}

/* ---------- title ---------- */
.masthead{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;margin:6px 0 16px}
.masthead .mark{grid-row:span 2;width:58px;height:58px;border-radius:14px;background:var(--chart);display:grid;place-items:center}
.masthead .mark svg{width:40px;height:40px}
.masthead h1{margin:0;font-size:clamp(24px,3.4vw,38px);font-weight:900;letter-spacing:.02em;line-height:1.15}
.masthead p{margin:0;color:var(--muted);font-size:clamp(13px,1.5vw,15px);max-width:62ch}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--chart);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(8,32,45,.55)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;display:grid;place-items:center;background:#051620}
.stage:fullscreen canvas{position:relative;inset:auto;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
.chapcard{position:absolute;left:clamp(10px,2vw,22px);top:clamp(10px,2vw,20px);display:flex;align-items:stretch;gap:12px;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s}
.chapcard.show{opacity:1;transform:none}
.chapcard .no{font-family:var(--cond);font-weight:700;font-size:clamp(30px,4.6vw,58px);line-height:.9;color:var(--signal);text-shadow:0 2px 12px rgba(0,0,0,.35)}
.chapcard .tt{display:flex;flex-direction:column;justify-content:center;padding-left:12px;border-left:3px solid var(--signal)}
.chapcard b{font-size:clamp(15px,2.1vw,26px);font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45);line-height:1.2}
.chapcard i{font-style:normal;font-family:var(--cond);font-weight:500;font-size:clamp(12px,1.35vw,17px);color:rgba(255,255,255,.82);letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.caption{position:absolute;left:50%;bottom:clamp(8px,1.8vw,20px);transform:translateX(-50%);max-width:min(88%,760px);background:rgba(7,26,37,.78);color:#f2f6f7;border-radius:10px;padding:7px 16px;font-size:clamp(12px,1.5vw,17px);font-weight:500;text-align:center;pointer-events:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .35s}
.caption:empty{opacity:0}
.caption .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--signal);margin-right:8px;vertical-align:middle;transform:translateY(-1px)}
.scale-note{position:absolute;right:12px;top:10px;font-size:11px;color:rgba(255,255,255,.62);pointer-events:none}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);height:40px;min-width:40px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;font:inherit;font-size:14px;padding:0 10px}
.btn:hover{border-color:var(--sea)}
.btn:focus-visible,.seg button:focus-visible,.chap:focus-visible,.timeline:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn svg{width:18px;height:18px}
.btn.play{background:var(--chart);color:#fff;border-color:var(--chart);min-width:48px}
.timeline{position:relative;flex:1 1 320px;height:40px;display:flex;align-items:center;cursor:pointer;touch-action:none;border-radius:8px}
.tl-track{position:relative;display:flex;width:100%;height:12px;border-radius:3px;overflow:hidden;background:var(--line)}
.tl-seg{height:100%;border-right:2px solid var(--bg);position:relative}
.tl-seg:nth-child(odd){background:rgba(19,35,46,.10)}
.tl-seg:last-child{border-right:0}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:var(--chart);pointer-events:none}
:root[data-theme="dark"] .tl-fill{background:var(--sea)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl-fill{background:var(--sea)}}
.tl-head{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--signal);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
.time{font-family:var(--cond);font-weight:600;font-size:16px;color:var(--muted);min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:40px;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--cond);font-weight:600;font-size:15px;padding:0 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chart);color:#fff}
.btn.toggle[aria-pressed="false"]{color:var(--muted)}

/* ---------- info ---------- */
.info{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.info h2{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:900;line-height:1.25;display:flex;align-items:baseline;gap:12px}
.info h2 .n{font-family:var(--cond);font-weight:700;color:var(--sea);font-size:1.15em}
.info .en{margin:2px 0 12px;font-family:var(--cond);font-size:18px;font-weight:500;color:var(--muted)}
.info .desc{margin:0;font-size:16px;line-height:1.85;max-width:44em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:0;list-style:none}
.chips li{font-size:13px;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.steps{list-style:none;margin:0;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;counter-reset:s}
.steps h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.steps li{position:relative;padding:8px 0 8px 34px;font-size:15px;color:var(--muted);border-top:1px dashed var(--line);counter-increment:s;transition:color .3s}
.steps li:first-of-type{border-top:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:13px;color:var(--muted);background:var(--surface)}
.steps li.done{color:var(--ink)}
.steps li.done::before{content:"✓";background:var(--stepdone);border-color:var(--stepdone);color:#fff}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{background:var(--signal);border-color:var(--signal);color:#13232e}

/* ---------- chapter index ---------- */
.chapters{margin-top:28px}
.chapters h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chap{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;display:flex;gap:10px;align-items:center;min-height:48px}
.chap .n{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--muted);min-width:24px}
.chap .t{font-size:14px;line-height:1.3}
.chap:hover{border-color:var(--sea)}
.chap.active{background:var(--chart);border-color:var(--chart);color:#fff}
.chap.active .n{color:var(--signal)}
.chap.past .n{color:var(--sea)}
.foot{margin-top:28px;font-size:13px;color:var(--muted);max-width:80ch;line-height:1.7}

@media (max-width:820px){
  .info{grid-template-columns:1fr;gap:18px}
  .masthead .mark{width:46px;height:46px;border-radius:12px}
  .masthead .mark svg{width:32px;height:32px}
  .scale-note{display:none}
  .stage{border-radius:12px}
}
@media (max-width:560px){
  .chapcard{gap:8px}
  .chapcard .tt{padding-left:8px;border-left-width:2px}
  .caption{padding:5px 10px;border-radius:8px}
  .time{min-width:0;font-size:14px}
  .seg button{padding:0 8px}
}
@media (prefers-reduced-motion:reduce){
  .chapcard,.caption{transition:none}
}
/* ---------- i18n ---------- */
:root[lang="ja"]{--sans:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans TC",system-ui,sans-serif;--cond:"Barlow Condensed","Arial Narrow","Noto Sans JP","Noto Sans TC",sans-serif}
.masthead{grid-template-columns:auto 1fr auto}
.langsw{grid-column:3;grid-row:1 / span 2;align-self:start;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:36px;background:var(--surface)}
.langsw button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:0 12px;cursor:pointer;white-space:nowrap}
.langsw button+button{border-left:1px solid var(--line)}
.langsw button[aria-pressed="true"]{background:var(--chart);color:#fff}
.langsw button:focus-visible{outline:3px solid var(--signal);outline-offset:-3px}
:root[data-theme="dark"] .seg button[aria-pressed="true"],:root[data-theme="dark"] .langsw button[aria-pressed="true"]{background:var(--sea);color:#08202d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"],:root:not([data-theme="light"]) .langsw button[aria-pressed="true"]{background:var(--sea);color:#08202d}}

/* ---------- video export ---------- */
.btn.rec{display:inline-flex;align-items:center;gap:8px;padding:0 13px}
.btn.rec .rdot{width:10px;height:10px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 3px rgba(232,87,42,.2)}
.recdlg{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:20px clamp(16px,3vw,26px);width:min(540px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 60px -30px rgba(5,22,32,.65)}
.recdlg::backdrop{background:rgba(5,22,32,.55)}
.rec-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rec-head h2{margin:0;font-size:20px;font-weight:900;line-height:1.3}
.rec-head .btn{height:36px;min-width:36px}
.rec-intro{margin:8px 0 18px;color:var(--muted);font-size:14px;line-height:1.75}
.rec-opts{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center}
.rec-opts>span{font-size:14px;font-weight:700;color:var(--muted)}
.rec-opts .seg{justify-self:start;height:36px}
.rec-opts .seg button{min-width:54px}
.seg button.tx{font-family:var(--sans);font-size:13px;font-weight:500;padding:0 12px}
.recdlg.busy .rec-opts{opacity:.5;pointer-events:none}
.rec-sum{margin:16px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec-prog{margin-top:14px}
.rec-prog canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:10px;background:var(--chart)}
.rec-bar{margin-top:10px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.rec-bar i{display:block;height:100%;width:0;background:var(--signal)}
.rec-stat{margin:8px 0 0;font-size:14px;min-height:1.6em}
.rec-stat.err{color:var(--alert);font-weight:500}
.rec-note{margin:2px 0 0;font-size:12px;color:var(--muted)}
.rec-act{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.primary{background:var(--chart);color:#fff;border-color:var(--chart);padding:0 18px;font-weight:700}
.btn.primary:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
[hidden]{display:none!important}
@media (max-width:560px){
  .masthead{grid-template-columns:auto 1fr}
  .langsw{grid-column:1 / -1;grid-row:auto;justify-self:start;margin-top:4px}
  .rec-opts{grid-template-columns:1fr;gap:4px}
  .rec-opts .seg{margin-bottom:8px}
}
.masthead .series{grid-column:2;margin:0;font-size:13px;color:var(--muted);font-weight:500}
.masthead .series a{color:inherit}
.shots{margin-top:28px}
.shots h3,.facts h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.facts{margin-top:28px}
.fact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact dt{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1;color:var(--ink)}
.fact dt small{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--sea);margin-left:4px}
.fact dd{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.55}
.chapcard .no small{font-size:.45em;color:rgba(255,255,255,.75);margin-left:4px;font-weight:600}

</style>

<nav class="topnav" aria-label="Series"><a href="../index.html"><span data-zh="再生能源動畫館" data-en="Renewable Energy Animations" data-ja="再生可能エネルギー・アニメーション館">再生能源動畫館</span></a><a href="index.html"><span data-zh="海洋能系列" data-en="Ocean Energy series" data-ja="海洋エネルギーシリーズ">海洋能系列</span></a><span class="sp"></span><a href="index.html"><span data-zh="回到本系列 →" data-en="Back to the series →" data-ja="シリーズへ戻る →">回到本系列 →</span></a></nav>
  <header class="masthead">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40"><path d="M20 17 L21.4 37 H18.6 Z" fill="#e3ecee"/><rect x="17.2" y="33" width="5.6" height="4" fill="#f2c230"/><g fill="#e3ecee"><path d="M20 15.5 L20.9 2 L19.4 2.2 Z"/><path d="M20 15.5 L31.8 22.3 L32.3 20.9 Z" /><path d="M20 15.5 L8.2 22.3 L8.9 23.6 Z"/></g><circle cx="20" cy="15.8" r="2.2" fill="#f2c230"/></svg>

      <button class="btn" id="bPrev" data-i18n-aria="prev" aria-label="上一個分鏡"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn play" id="bPlay" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>

<dialog class="recdlg" id="recDlg" aria-labelledby="recTitle">
  <div class="rec-head">
    <h2 id="recTitle" data-i18n="recTitle">錄製 MP4 影片</h2>
    <button class="btn" id="recX" type="button" data-i18n-aria="close" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p class="rec-intro" data-i18n="recIntro"></p>
  <div class="rec-opts">
    <span id="oSpeed" data-i18n="optSpeed">影片速度</span>
    <div class="seg" role="group" aria-labelledby="oSpeed" data-opt="speed"><button type="button" data-v="1" aria-pressed="true">1×</button><button type="button" data-v="2" aria-pressed="false">2×</button></div>
    <span id="oRange" data-i18n="optRange">範圍</span>
    <div class="seg" role="group" aria-labelledby="oRange" data-opt="range"><button type="button" class="tx" data-v="all" aria-pressed="true" data-i18n="rangeAll">全片</button><button type="button" class="tx" data-v="chap" aria-pressed="false" data-i18n="rangeChap">目前分鏡</button></div>
    <span id="oRes" data-i18n="optRes">解析度</span>

  </div>
  <p class="rec-sum" id="recSum"></p>

    <p class="rec-stat" id="recStat" aria-live="polite"></p>
    <p class="rec-note" id="recNote" data-i18n="keepTab"></p>
  </div>

  </div>

{t:'海上的點吸收式浮標',en:'A point absorber at sea',dur:13,side:true,
 d:'點吸收式浮標是最常見的波浪發電裝置之一。浮體漂在海面上，湧浪通過時跟著上下起伏；浮體透過繫纜連到海床基礎，海床幾乎不動，兩者之間的相對運動就由浮體裡的動力擷取系統（PTO）轉成電力。電力經動態海纜與海底電纜送到岸上變電站併網。一座浮標容量約數十到數百瓩，實際案場會把多座浮標排成陣列，共用海纜與併網設備。',
 s:[[0,'湧浪一波接一波通過浮標'],[.26,'浮體隨浪起伏，繫纜連到海床基礎'],[.52,'浮體與海床的相對運動轉成電力'],[.76,'電力經海底電纜送上岸併網']],
 cam:u=>camMix({x:800,y:480,s:1},{x:700,y:500,s:1.12},ease(seg(u,.1,.6))),
 draw(u){},
 fx(u){
  flowDots(P_CAB(),8,PWR,band(u,.74,1),.25,4);
  const y=fyAt(BX);
  lab(BX,y-40,'浮體',{dx:-60,dy:-90,st:'s',a:band(u,.24,.52)});
  lab(BX,640,'繫纜',{dx:70,dy:-20,a:band(u,.26,.52)});
  lab(BX,BED-30,'海床基礎',{dx:-90,dy:-40,a:band(u,.26,.52)});
  lab(BX,y,'動力擷取（PTO）',{dx:110,dy:-80,st:'s',a:band(u,.5,.76)});
  lab(1100,BED-4,'海底電纜',{dx:0,dy:-60,st:'s',a:band(u,.74,1)});
  lab(CX+226,360,'岸上變電站',{dx:-40,dy:-40,st:'g',a:band(u,.78,1),minor:true});
 },
 hud(u){hudPanel(240,150,'海況與出力（示例）',seg(u,.05,.1),w=>{const p=Math.max(0,120+90*Math.sin(TT*1.1))*ease(seg(u,.48,.6));
  hrow(56,'示性波高','2.0 m',w,WAV);hrow(88,'週期','8 s',w,'#fff');hrow(120,'輸出',Math.round(p)+' kW',w,PWR);});}},

{t:'波浪能量從哪裡來',en:'Where wave energy comes from',dur:13,
 d:'風吹過海面，把能量傳給海水形成波浪；風越強、吹得越久、吹過的距離越遠，波浪就越大。波浪能用每公尺波峰寬度的功率表示，稱為波能流密度，約等於 0.49 乘上波高的平方再乘上週期，單位是 kW/m。波高加倍，能量變成四倍，所以選址時最看重波高。示性波高 2 m、週期 8 s 的湧浪，每公尺波峰約帶有 16 kW 的功率。',
 s:[[0,'風把能量交給海面，形成波浪'],[.26,'波高 H 與週期 T 決定波浪的能量'],[.5,'波能流：P ≈ 0.49 × H² × T'],[.74,'波高加倍，能量變成四倍']],
 draw(u){
  diagBG();
  card(60,150,720,650,{bg:'rgba(7,27,39,.75)'});wt(84,196,'波高與週期',20,'#f2c230',700);
  /* 風 */
  const wa=seg(u,.02,.1);for(let i=0;i<4;i++){const p=(TT*.6+i/4)%1;alphaDo(wa*(1-Math.abs(p-.5)*2),()=>arrow(120+p*400,260+i*26,180+p*400,260+i*26,'rgba(227,236,238,.8)',2.5));}
  alphaDo(wa,()=>wt(640,290,'風',20,'#fff',700,'center'));
  /* 波形 */
  const Y0=500,A=60,L=380,X0=100,X1=740,ph=TT*1.4,wy=x=>Y0-A*Math.sin(TAU*(x-X0)/L-ph);
  ctx.beginPath();ctx.moveTo(X0,720);for(let x=X0;x<=X1;x+=4)ctx.lineTo(x,wy(x));ctx.lineTo(X1,720);ctx.closePath();ctx.fillStyle='rgba(88,184,208,.35)';ctx.fill();
  ctx.beginPath();for(let x=X0;x<=X1;x+=4)ctx.lineTo(x,wy(x));ctx.strokeStyle='#7dc8dc';ctx.lineWidth=3;ctx.stroke();
  const ha=band(u,.24,1);if(ha>0)alphaDo(ha,()=>{ctx.setLineDash([6,6]);ln([X0,Y0-A,X1,Y0-A],'rgba(242,194,48,.7)',1.5);ln([X0,Y0+A,X1,Y0+A],'rgba(242,194,48,.7)',1.5);ctx.setLineDash([]);
   arrow(180,Y0,180,Y0-A+4,PWR,2.5);arrow(180,Y0,180,Y0+A-4,PWR,2.5);wt(196,Y0+8,'波高 H',19,PWR,700,'left');
   arrow(330,640,330+L,640,'#7dffc4',2.5);arrow(330+L,640,330,640,'#7dffc4',2.5);wt(330+L/2,680,'一個週期 T 通過一個波長',18,'#7dffc4',700,'center');});
  /* 公式 */
  alphaDo(seg(u,.5,.56),()=>{card(90,720,660,64,{bg:'rgba(242,194,48,.12)',st:'rgba(242,194,48,.6)'});wt(420,762,'P ≈ 0.49 × H² × T（kW/m）',22,PWR,700,'center',COND);});
  /* 右：圖表 */
  card(820,150,720,650,{bg:'rgba(7,27,39,.75)'});wt(844,196,'波能流密度與波高',20,'#f2c230',700);
  const c=chartBox(840,220,680,520,{x0:0,x1:4,y0:0,y1:80,xt:[0,1,2,3,4],yt:[0,20,40,60,80],xl:'示性波高 H（m）',yl:'kW/m'});
  const S=[[6,'rgba(227,236,238,.9)','T = 6 s',.3],[8,'#7dffc4','T = 8 s',.4],[10,'#ff8a60','T = 10 s',.5]];
  S.forEach(([T,col,n,t0])=>{const f=ease(seg(u,t0,t0+.2));if(f<=0)return;const P=[];for(let i=0;i<=40;i++){const H=4*i/40;P.push({x:c.X(H),y:c.Y(wavePower(H,T))});}
   pathLine(partial(P,f),col,3);alphaDo(seg(u,t0+.16,t0+.22),()=>wt(c.X(4)-6,c.Y(wavePower(4,T))-10,n,17,col,700,'right',COND));});
  const ka=seg(u,.72,.78);if(ka>0)alphaDo(ka,()=>{const x=c.X(2),y=c.Y(wavePower(2,8));circ(x,y,7,PWR);ln([x,y,x,c.Y(0)],'rgba(242,194,48,.5)',1.5);
   const qx=c.X(.2)+150,qy=c.Y(62);ln([x,y,qx,qy+45],'rgba(242,194,48,.6)',1.5);card(qx-150,qy-45,300,90,{bg:'rgba(7,27,39,.92)',st:PWR});wt(qx,qy-9,'H 2 m、T 8 s',18,'#fff',700,'center');wt(qx,qy+25,trf('約 {n} kW/m',{n:wavePower(2,8).toFixed(1)}),20,PWR,700,'center',COND);});
 }},

{t:'點吸收式浮標怎麼運作',en:'How a point absorber works',dur:14,
 d:'點吸收式浮標的直徑通常只有數公尺，比波長小得多，因此不論波浪從哪個方向來，都能從四周吸收能量，好像一個「點」。浮體受浮力推動上下運動，繫纜另一端固定在海床，動力擷取系統就在兩者之間拉伸與收縮。若讓浮體的運動節奏和波浪同步，形成共振，位移可以比波高大好幾倍；國外業者以相位控制讓浮體在 1 m 的浪中上下移動約 3 m，吸收更多能量。',
 s:[[0,'浮體直徑遠小於波長，像一個點'],[.24,'四面八方來的波浪都能吸收'],[.48,'浮體與海床之間的相對運動推動 PTO'],[.72,'共振與相位控制，讓浮體動得比浪更大']],
 draw(u){
  diagBG();
  card(60,150,720,650,{bg:'rgba(7,27,39,.75)'});wt(84,196,'側視：浮體、PTO 與繫纜',20,'#f2c230',700);
  const Y0=380,A=40,L=520,ph=TT*1.4,wy=x=>Y0-A*Math.sin(TAU*(x-80)/L-ph),X=420;
  ctx.beginPath();ctx.moveTo(80,760);for(let x=80;x<=760;x+=4)ctx.lineTo(x,wy(x));ctx.lineTo(760,760);ctx.closePath();ctx.fillStyle='rgba(29,102,144,.55)';ctx.fill();
  ctx.beginPath();for(let x=80;x<=760;x+=4)ctx.lineTo(x,wy(x));ctx.strokeStyle='#7dc8dc';ctx.lineWidth=2.5;ctx.stroke();
  box(80,740,680,40,'#b59a6a');
  const amp=lerp(1,1.8,ease(seg(u,.72,.8))),fy=Y0-A*amp*Math.sin(TAU*(X-80)/L-ph-.3*amp);
  ln([X,fy+60,X,712],'#e3e8ec',3);box(X-50,712,100,28,'#6a747a');
  /* 浮體剖面：PTO 缸體 */
  rrp(X-80,fy-40,160,80,20);ctx.fillStyle='#e3b53a';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.stroke();
  const pa=band(u,.46,1);box(X-22,fy-30,44,72,pa>0?'rgba(242,194,48,'+(.25+.5*pa)+')':'#2a3a46','rgba(0,0,0,.4)',1);
  const rod=clamp((fy-Y0)/(A*1.8),-1,1);box(X-16,fy-10+rod*14,32,10,'#c9d1d6');ln([X,fy+rod*14,X,fy+60],'#c9d1d6',5);
  const aa=band(u,.46,1);if(aa>0)alphaDo(aa,()=>{arrow(X+120,Y0,X+120,Y0-60,'#7dffc4',3);arrow(X+120,Y0,X+120,Y0+60,'#7dffc4',3);wt(X+140,Y0+8,'相對運動',18,'#7dffc4',700,'left');});
  wt(X-100,fy+6,'浮體',18,'#fff',700,'right');alphaDo(pa,()=>wt(X,fy-52,'PTO',18,PWR,700,'center',COND));
  wt(X+30,650,'繫纜',17,'rgba(227,236,238,.9)',600,'left');wt(X+64,732,'海床基礎',17,'rgba(227,236,238,.9)',600,'left');
  /* 右上：俯視 */
  card(820,150,720,310,{bg:'rgba(7,27,39,.75)'});wt(844,196,'俯視：從各方向吸收',20,'#f2c230',700);
  const cx=1180,cy=320,da=seg(u,.2,.3);
  for(let i=0;i<3;i++){const p=(TT*.35+i/3)%1;ring(cx,cy,20+p*110,'rgba(125,200,220,'+(.6*(1-p))+')',2);}
  if(da>0)alphaDo(da,()=>{for(let k=0;k<6;k++){const a=k*TAU/6+.3,r=120;arrow(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.9,cx+Math.cos(a)*40,cy+Math.sin(a)*36,'#7dc8dc',2.5);}});
  circ(cx,cy,18,'#e3b53a','rgba(0,0,0,.4)',1.5);wt(1510,440,'直徑數公尺，遠小於波長',17,'rgba(227,236,238,.85)',600,'right');
  /* 右下：共振 */
  card(820,490,720,310,{bg:'rgba(7,27,39,.75)'});wt(844,536,'共振與相位控制（示例）',20,'#f2c230',700);
  const gx0=860,gx1=1500,gy=660;ln([gx0,gy,gx1,gy],'rgba(255,255,255,.15)',1);
  const curve=(am,col,lw,f,sh)=>{const P=[];for(let i=0;i<=80;i++){const x=gx0+(gx1-gx0)*i/80;P.push({x,y:gy-am*Math.sin(i/80*TAU*2-TT*1.4+sh)});}pathLine(partial(P,f),col,lw);};
  curve(26,'#7dc8dc',2.5,1,0);const ra=ease(seg(u,.72,.84));if(ra>0)curve(26+52*ra,PWR,3,1,-.4);
  wt(gx0,776,'波浪 1 m',17,'#7dc8dc',700,'left');alphaDo(ra,()=>wt(gx1,776,'浮體位移 約 3 m',17,PWR,700,'right'));
 }},

{t:'動力擷取：液壓與直驅',en:'Power take-off: hydraulic vs direct drive',dur:14,
 d:'浮體的運動慢而有力，每秒只有一兩公尺，方向還不斷反轉，動力擷取系統要把它變成穩定的電力。液壓式用活塞把油壓進蓄壓器，再以固定壓力推動液壓馬達與發電機，能平滑波浪起伏、承受很大的力，但油路元件多、需要定期保養。直驅線性發電機讓裝有磁鐵的動子直接在線圈中往復移動發電，零件少、效率高，但低速大推力使發電機又大又重，輸出電壓與頻率不斷變化，要靠變流器整理後才能併網。',
 s:[[0,'浮體運動慢、力量大，方向不斷反轉'],[.24,'液壓式：活塞壓油，蓄壓器平滑出力'],[.52,'直驅式：磁鐵在線圈中往復，直接發電'],[.78,'變流器把變動的電整理成穩定的交流電']],
 draw(u){
  diagBG();
  const L=band(u,.2,1),R=band(u,.5,1),hl=(k,on)=>on?'rgba(242,194,48,.7)':'rgba(255,255,255,.12)';
  card(60,150,720,650,{bg:'rgba(7,27,39,.75)',st:hl(0,u>=.24&&u<.52)});wt(84,196,'液壓式 PTO',20,'#f2c230',700);
  card(820,150,720,650,{bg:'rgba(7,27,39,.75)',st:hl(1,u>=.52)});wt(844,196,'直驅線性發電機',20,'#f2c230',700);
  const st=Math.sin(TT*1.6);
  /* 液壓：活塞缸 → 蓄壓器 → 馬達 → 發電機 */
  box(110,250,70,220,'#44535c','rgba(255,255,255,.3)',1);const py=330+st*50;box(114,py,62,16,'#c9d1d6');ln([145,py,145,240],'#c9d1d6',6);
  alphaDo(.8,()=>box(114,py+16,62,454-py,'rgba(255,138,96,.45)'));
  wt(145,500,'活塞缸',17,'#fff',700,'center');
  rrp(270,270,70,170,34);ctx.fillStyle='#8d989f';ctx.fill();wt(305,470,'蓄壓器',17,'#fff',700,'center');
  circ(470,350,44,'#5c6770','rgba(255,255,255,.3)',1);for(let i=0;i<4;i++){const a=TT*3*L+i*TAU/4;ln([470,350,470+Math.cos(a)*36,350+Math.sin(a)*36],'#c9d1d6',4);}wt(470,430,'液壓馬達',17,'#fff',700,'center');
  ln([514,350,580,350],'#8d989f',8);box(580,300,130,100,'#1f7f99','rgba(255,255,255,.3)',1);wt(645,430,'發電機',17,'#fff',700,'center');
  const Po=[[180,440],[230,440],[230,400],[270,400]],Pa=[[340,350],[426,350]],Pr=[[470,394],[470,450],[180,450]];
  [Po,Pa,Pr].forEach(P=>pl(P,'rgba(141,152,159,.8)',5));flowDots(Po,3,OIL,L,.6,5);flowDots(Pa,3,OIL,L,.6,5);flowDots(Pr,5,'#ff9d7a',L*.6,.3,4);
  alphaDo(L,()=>{for(let i=0;i<3;i++){const p=(TT*1.2+i/3)%1;ln([712,340+i*12,712+30*p,340+i*12],PWR,3);}});
  /* 右：線性發電機 */
  const cx=1000,cy=280;for(let i=0;i<8;i++)box(cx-60,cy+i*24,20,18,'#c77d3a','rgba(0,0,0,.3)',1);for(let i=0;i<8;i++)box(cx+40,cy+i*24,20,18,'#c77d3a','rgba(0,0,0,.3)',1);
  const my=cy-30+st*50;for(let i=0;i<6;i++)box(cx-30,my+i*30,60,28,i%2?'#e8572a':'#58b8d0','rgba(0,0,0,.35)',1);ln([cx,my,cx,cy-60],'#c9d1d6',6);
  wt(cx,cy+230,'線圈（定子）＋磁鐵（動子）',17,'#fff',700,'center');
  /* 輸出波形 */
  const ox=1120,oy=340;ln([ox,oy,1500,oy],'rgba(255,255,255,.15)',1);
  if(R>0)alphaDo(R,()=>{const P=[];for(let i=0;i<=120;i++){const t=i/120,env=Math.abs(Math.sin(t*TAU*1-TT*1.6));P.push({x:ox+380*t,y:oy-60*env*Math.sin(t*TAU*9-TT*8)});}pathLine(P,MAG,2);wt(1310,440,'電壓與頻率不斷變化',17,MAG,700,'center');});
  const ia=seg(u,.78,.84);if(ia>0)alphaDo(ia,()=>{box(1120,470,160,60,'#44535c','rgba(255,255,255,.3)',1);wt(1200,508,'變流器',18,'#fff',700,'center');arrow(1290,500,1340,500,PWR,3);
   const P=[];for(let i=0;i<=60;i++){const t=i/60;P.push({x:1350+150*t,y:500-26*Math.sin(t*TAU*3-TT*4)});}pathLine(P,'#7dffc4',2.5);});
  /* 優缺點 */
  const pc=(x,y,good,bad,a)=>alphaDo(a,()=>{tag(x,y,'優點',{bg:'rgba(125,255,196,.2)',fg:'#7dffc4',size:16});wt(x+60,y+6,good,18,'#fff',600,'left');
   tag(x,y+54,'限制',{bg:'rgba(232,87,42,.2)',fg:'#ff8a60',size:16});wt(x+60,y+60,bad,18,'#fff',600,'left');});
  pc(100,640,'出力平滑、承受大力量','油路元件多、需定期保養',L);
  pc(860,640,'零件少、效率高','體積大且重、需要變流器',R);
 }},

{t:'錨繫與海纜',en:'Moorings and cables',dur:13,side:true,
 d:'浮標要在大浪中留在原地，錨繫系統是關鍵。張力式繫纜把浮體拉向海床基礎，基礎可用重力式混凝土塊、樁或吸力式沉箱，視海床是砂、泥或岩盤而定。浮標上下起伏，電纜不能繃直，所以從浮體到海床之間用帶浮力模組的動態海纜，彎成緩和的 S 形吸收運動，再接到固定在海床上的海底電纜送往岸邊。國外試驗案例多設在離岸數公里、水深約 40 到 50 m 的海域。',
 s:[[0,'鏡頭潛入水下，看浮標怎麼固定'],[.24,'張力式繫纜把浮體拉向海床基礎'],[.5,'動態海纜彎成 S 形，吸收浮體起伏'],[.76,'海底電纜沿海床送往岸上變電站']],
 cam:u=>camMix({x:800,y:480,s:1},{x:720,y:600,s:1.4},ease(seg(u,.02,.2))),
 draw(u){
  const y=fyAt(BX)+22,a=band(u,.46,1);
  if(a>0)alphaDo(a,()=>{const P=[];for(let i=0;i<=30;i++){const t=i/30;P.push({x:BX+20+t*180,y:lerp(y,BED-10,t)-90*Math.sin(t*Math.PI)*(1-t*.3)+(1-t)*(fyAt(BX)-SW.y)*.3});}
   pathLine(P,'#1a1a1a',4);for(let k=0;k<4;k++){const p=P[10+k*2];circ(p.x,p.y,7,'#e3b53a','rgba(0,0,0,.4)',1);}});
 },
 fx(u){
  flowDots(P_CAB(),8,PWR,band(u,.74,1),.25,4);
  lab(BX,700,'張力式繫纜',{dx:-110,dy:-30,st:'s',a:band(u,.22,.5)});
  lab(BX,BED-26,'海床基礎',{dx:-80,dy:-50,a:band(u,.22,.5)});
  lab(BX+110,fyAt(BX)+60,'動態海纜',{dx:90,dy:-40,st:'s',a:band(u,.5,.78)});
  lab(BX+100,540,'浮力模組',{dx:110,dy:30,a:band(u,.52,.78),minor:true});
  lab(900,BED-4,'海底電纜',{dx:40,dy:-50,st:'g',a:band(u,.76,1)});
 },
 hud(u){hudPanel(240,150,'錨繫（示例）',seg(u,.05,.1),w=>{const t=Math.round(600+300*Math.sin(TT*1.1));
  hrow(56,'水深','約 45 m',w,WAV);hrow(88,'繫纜張力',trf('{n} kN',{n:t}),w,'#fff');hbar(14,100,w-28,t/1000,PWR);hrow(136,'離岸距離','約 4 km',w,'#7dffc4');});}},

{t:'海況與颱風',en:'Sea states and typhoons',dur:13,

Object.assign(DICT,{
"海洋能系列":["Ocean Energy Series","海洋エネルギーシリーズ"],
"波浪發電：點吸收式浮標":["Wave power: the point absorber buoy","波力発電：ポイントアブソーバー型ブイ"],
"海浪是風把能量交給海面的結果，一波接一波把能量送到岸邊。這一集從波浪能量的大小怎麼算談起，看點吸收式浮標如何隨浪上下運動，比較液壓與直驅線性發電機兩種動力擷取方式，再介紹錨繫、海纜與颱風海況的挑戰，以及台灣的波浪能潛力。":["Ocean waves are energy handed from the wind to the sea surface, carried toward the coast one wave after another. This episode starts with how wave energy is calculated, shows how a point absorber buoy rides up and down on the swell, compares hydraulic and direct-drive linear generator power take-off, then looks at moorings, cables and the challenge of typhoon sea states, and finally Taiwan's wave energy potential.","海の波は、風が海面に渡したエネルギーが一波ずつ岸へ運ばれてくるものです。このエピソードでは波のエネルギーの大きさの求め方から始め、ポイントアブソーバー型ブイが波に合わせて上下する仕組みを見たうえで、油圧式と直動リニア発電機の二つの動力変換方式を比較し、係留・海底ケーブル・台風時の海象という課題、そして台湾の波力エネルギーの可能性を紹介します。"],
"每公尺波峰寬的波能流係數：P ≈ 0.49 × H² × T":["Wave power per metre of crest: P ≈ 0.49 × H² × T","波峰幅 1 m あたりの波パワー係数：P ≈ 0.49 × H² × T"],
"台灣東北部、澎湖西側與巴士海峽的波能流密度":["Wave power density off NE Taiwan, west of Penghu and in the Bashi Channel","台湾北東部・澎湖西側・バシー海峡の波パワー密度"],
"約 10":["About 10","約 10"],
"台灣周邊海域波浪能蘊藏量估計":["Estimated wave energy resource around Taiwan","台湾周辺海域の波力エネルギー賦存量の推計"],
"處":["sites","か所"],
"蘇澳港規劃的離岸式波浪發電試驗區":["Offshore wave energy test zones planned at Su'ao Port","蘇澳港で計画された沖合波力発電の試験区域"],
"業界預估 2030 年前的波浪能裝置容量":["Industry estimate of installed wave capacity by 2030","業界が見込む 2030 年までの波力発電の設備容量"],
"國外直徑 9 m 點吸收式浮標的單機容量（示例）":["Rating of a 9 m diameter point absorber abroad (example)","海外の直径 9 m ポイントアブソーバーの単機容量（例）"],
"說明：本集為教育用途示意動畫，浮標外觀、水深與波浪比例經過壓縮調整。波能流公式 P ≈ ρg²H²T／64π（約 0.49 H²T kW/m，H 為示性波高、T 為能量週期）為海洋工程通用式；台灣波能流密度 15–20 kW/m 與蘊藏量約 10 GW 取自國科會科技大觀園與中央氣象署科普資料；蘇澳港 3 處試驗區與 2030 年 50–100 MW 預估取自 Reccessary 專家觀點；直徑 9 m、300 kW 浮標與水深約 45 m 參考 CorPower C4 在葡萄牙的公開資料。每月波能、張力、出力與颱風存活模式等數值為典型範例。":["Note: this is an illustrative educational animation; buoy appearance, water depth and wave proportions are compressed. The wave power formula P ≈ ρg²H²T/64π (about 0.49 H²T kW/m, with H the significant wave height and T the energy period) is standard in ocean engineering. Taiwan's wave power density of 15–20 kW/m and resource of about 10 GW come from NSTC Science and Technology Vista and Central Weather Administration outreach material; the three Su'ao Port test zones and the 50–100 MW estimate for 2030 come from a Reccessary expert column; the 9 m, 300 kW buoy and about 45 m water depth refer to public information on the CorPower C4 in Portugal. Monthly wave power, tension, output and typhoon survival mode values are typical examples.","説明：本エピソードは教育用の模式アニメーションで、ブイの外観、水深、波の比率は圧縮して描いています。波パワーの式 P ≈ ρg²H²T／64π（約 0.49 H²T kW/m、H は有義波高、T はエネルギー周期）は海洋工学の一般式です。台湾の波パワー密度 15–20 kW/m と賦存量約 10 GW は国家科学及技術委員会「科技大観園」と中央気象署の解説資料、蘇澳港の試験区域 3 か所と 2030 年 50–100 MW の見込みは Reccessary の専門家コラム、直径 9 m・300 kW のブイと水深約 45 m はポルトガルの CorPower C4 の公開資料を参考にしています。月別の波パワー、張力、出力、台風時のサバイバルモードの数値は典型的な例です。"],
"海上的點吸收式浮標":["A point absorber at sea","海上のポイントアブソーバー"],
"點吸收式浮標是最常見的波浪發電裝置之一。浮體漂在海面上，湧浪通過時跟著上下起伏；浮體透過繫纜連到海床基礎，海床幾乎不動，兩者之間的相對運動就由浮體裡的動力擷取系統（PTO）轉成電力。電力經動態海纜與海底電纜送到岸上變電站併網。一座浮標容量約數十到數百瓩，實際案場會把多座浮標排成陣列，共用海纜與併網設備。":["The point absorber is one of the most common wave energy devices. A float sits on the sea surface and rises and falls as the swell passes. It is tethered to a foundation on the seabed, which barely moves, and the power take-off (PTO) inside the float turns the relative motion between the two into electricity. Power travels through a dynamic cable and a subsea export cable to an onshore substation and the grid. A single buoy is rated from tens to hundreds of kilowatts, so real projects arrange many buoys in an array that shares cables and grid connection equipment.","ポイントアブソーバーは最も一般的な波力発電装置の一つです。浮体は海面に浮かび、うねりが通過するたびに上下します。浮体は係留索で海底基礎につながっており、ほとんど動かない海底との相対運動を、浮体内の動力変換装置（PTO）が電力に変えます。電力はダイナミックケーブルと海底ケーブルで陸上変電所へ送られ、系統に連系されます。ブイ 1 基の容量は数十〜数百 kW 程度のため、実際の発電所では多数のブイをアレイ状に並べ、ケーブルと連系設備を共用します。"],
"湧浪一波接一波通過浮標":["Swells roll past the buoy one after another","うねりが次々とブイを通過する"],
"浮體隨浪起伏，繫纜連到海床基礎":["The float rides the waves, tethered to a seabed foundation","浮体は波に合わせて上下し、係留索で海底基礎につながる"],
"浮體與海床的相對運動轉成電力":["Relative motion between float and seabed becomes electricity","浮体と海底の相対運動を電力に変える"],
"電力經海底電纜送上岸併網":["Power goes ashore by subsea cable to the grid","電力は海底ケーブルで陸へ送られ系統に連系"],
"浮體":["Float","浮体"],
"繫纜":["Tether","係留索"],
"海床基礎":["Seabed foundation","海底基礎"],
"動力擷取（PTO）":["Power take-off (PTO)","動力変換装置（PTO）"],
"海底電纜":["Export cable","海底ケーブル"],
"岸上變電站":["Onshore substation","陸上変電所"],
"海況與出力（示例）":["Sea state (example)","海象と出力（例）"],
"示性波高":["Sig. wave height","有義波高"],
"週期":["Period","周期"],
"輸出":["Output","出力"],
"波浪能量從哪裡來":["Where wave energy comes from","波のエネルギーはどこから来るのか"],
"風吹過海面，把能量傳給海水形成波浪；風越強、吹得越久、吹過的距離越遠，波浪就越大。波浪能用每公尺波峰寬度的功率表示，稱為波能流密度，約等於 0.49 乘上波高的平方再乘上週期，單位是 kW/m。波高加倍，能量變成四倍，所以選址時最看重波高。示性波高 2 m、週期 8 s 的湧浪，每公尺波峰約帶有 16 kW 的功率。":["Wind blowing across the sea hands its energy to the water and builds waves; the stronger the wind, the longer it blows and the farther it travels over open water, the bigger the waves. Wave energy is expressed as power per metre of wave crest, called wave power density, roughly 0.49 times the wave height squared times the period, in kW/m. Doubling the wave height quadruples the energy, which is why wave height matters most when choosing a site. A swell with a significant wave height of 2 m and a period of 8 s carries about 16 kW per metre of crest.","風が海面を吹き渡るとエネルギーが海水に伝わり、波ができます。風が強く、長く、遠くまで吹くほど波は大きくなります。波のエネルギーは波峰幅 1 m あたりのパワーで表し、波パワー密度と呼びます。およそ 0.49 × 波高の二乗 × 周期で、単位は kW/m です。波高が 2 倍になるとエネルギーは 4 倍になるため、立地選定では波高が最も重視されます。有義波高 2 m、周期 8 s のうねりは、波峰 1 m あたり約 16 kW のパワーを運びます。"],
"風把能量交給海面，形成波浪":["Wind hands its energy to the sea, making waves","風が海面にエネルギーを渡し、波ができる"],
"波高 H 與週期 T 決定波浪的能量":["Wave height H and period T set the energy","波高 H と周期 T が波のエネルギーを決める"],
"波能流：P ≈ 0.49 × H² × T":["Wave power: P ≈ 0.49 × H² × T","波パワー：P ≈ 0.49 × H² × T"],
"波高加倍，能量變成四倍":["Double the height and the energy quadruples","波高が 2 倍ならエネルギーは 4 倍"],
"波高與週期":["Wave height and period","波高と周期"],
"H 2 m、T 8 s":["H 2 m, T 8 s","H 2 m・T 8 s"],
"P ≈ 0.49 × H² × T（kW/m）":["P ≈ 0.49 × H² × T (kW/m)","P ≈ 0.49 × H² × T（kW/m）"],
"風":["Wind","風"],
"波高 H":["Height H","波高 H"],
"一個週期 T 通過一個波長":["One wavelength passes in one period T","周期 T で 1 波長が通過"],
"波能流密度與波高":["Wave power vs wave height","波パワー密度と波高"],
"示性波高 H（m）":["Significant wave height H (m)","有義波高 H（m）"],
"約 {n} kW/m":["About {n} kW/m","約 {n} kW/m"],
"點吸收式浮標怎麼運作":["How a point absorber works","ポイントアブソーバーの仕組み"],
"點吸收式浮標的直徑通常只有數公尺，比波長小得多，因此不論波浪從哪個方向來，都能從四周吸收能量，好像一個「點」。浮體受浮力推動上下運動，繫纜另一端固定在海床，動力擷取系統就在兩者之間拉伸與收縮。若讓浮體的運動節奏和波浪同步，形成共振，位移可以比波高大好幾倍；國外業者以相位控制讓浮體在 1 m 的浪中上下移動約 3 m，吸收更多能量。":["A point absorber is usually only a few metres across, much smaller than a wavelength, so it can absorb energy from waves arriving from any direction, as if it were a single point. Buoyancy drives the float up and down, the far end of the tether is fixed to the seabed, and the power take-off stretches and contracts between the two. If the float's motion is timed to match the waves and resonates with them, its travel can be several times the wave height; one developer abroad uses phase control to move the float about 3 m up and down in a 1 m wave, capturing more energy.","ポイントアブソーバーの直径は通常数 m と波長よりずっと小さいため、波がどの方向から来ても周囲からエネルギーを吸収でき、まるで一つの「点」のように働きます。浮体は浮力で上下し、係留索の反対側は海底に固定され、その間で動力変換装置が伸び縮みします。浮体の動きを波と同調させて共振させると、変位は波高の数倍になります。海外のメーカーは位相制御により、1 m の波で浮体を約 3 m 上下させ、より多くのエネルギーを吸収しています。"],
"浮體直徑遠小於波長，像一個點":["Much smaller than a wavelength, like a point","浮体は波長よりずっと小さく、点のように働く"],

"浮體的運動慢而有力，每秒只有一兩公尺，方向還不斷反轉，動力擷取系統要把它變成穩定的電力。液壓式用活塞把油壓進蓄壓器，再以固定壓力推動液壓馬達與發電機，能平滑波浪起伏、承受很大的力，但油路元件多、需要定期保養。直驅線性發電機讓裝有磁鐵的動子直接在線圈中往復移動發電，零件少、效率高，但低速大推力使發電機又大又重，輸出電壓與頻率不斷變化，要靠變流器整理後才能併網。":["The float moves slowly but with great force, only a metre or two per second, and keeps reversing direction; the power take-off has to turn this into steady electricity. A hydraulic PTO uses a piston to pump oil into an accumulator, which then drives a hydraulic motor and generator at constant pressure, smoothing out the waves and handling very large forces, but it has many hydraulic parts that need regular maintenance. A direct-drive linear generator moves a translator carrying magnets back and forth through coils to generate power directly, with few parts and high efficiency, but the low speed and high force make the generator large and heavy, and its voltage and frequency vary constantly, so a power converter must condition the output before it reaches the grid.","浮体の動きは遅く力強く、毎秒 1〜2 m ほどで、向きも絶えず反転します。動力変換装置はこれを安定した電力に変えなければなりません。油圧式はピストンで油をアキュムレータに押し込み、一定の圧力で油圧モータと発電機を回すため、波の変動を平滑化でき大きな力にも耐えますが、油圧部品が多く定期的な保守が必要です。直動リニア発電機は磁石を載せた可動子をコイルの中で往復させて直接発電し、部品が少なく効率も高い一方、低速・大推力のため発電機が大きく重くなり、電圧と周波数も絶えず変わるので、電力変換器で整えてから系統に連系します。"],

"浮標要在大浪中留在原地，錨繫系統是關鍵。張力式繫纜把浮體拉向海床基礎，基礎可用重力式混凝土塊、樁或吸力式沉箱，視海床是砂、泥或岩盤而定。浮標上下起伏，電纜不能繃直，所以從浮體到海床之間用帶浮力模組的動態海纜，彎成緩和的 S 形吸收運動，再接到固定在海床上的海底電纜送往岸邊。國外試驗案例多設在離岸數公里、水深約 40 到 50 m 的海域。":["The mooring system is what keeps a buoy on station in heavy seas. A taut tether pulls the float toward a seabed foundation, which may be a gravity concrete block, a pile or a suction caisson depending on whether the seabed is sand, mud or rock. Because the buoy keeps rising and falling, the cable cannot be pulled tight, so a dynamic cable fitted with buoyancy modules runs from the float to the seabed in a gentle S-shape that absorbs the motion, then joins a subsea export cable fixed to the seabed that carries power ashore. Test sites abroad are typically a few kilometres offshore in water about 40 to 50 m deep.","荒天の中でブイをその場にとどめるには係留システムが鍵となります。緊張係留索が浮体を海底基礎へ引き寄せ、基礎には海底が砂・泥・岩盤のどれかに応じて重力式コンクリートブロック、杭、サクションバケットを使います。ブイは上下し続けるためケーブルを張り詰めることはできず、浮体から海底までは浮力モジュール付きのダイナミックケーブルを緩やかな S 字に曲げて動きを吸収し、海底に固定した海底ケーブルにつないで陸へ送ります。海外の試験サイトの多くは、離岸数 km、水深約 40〜50 m の海域にあります。"],

/* ================= episode engine ================= */
const hn=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);};
const SH=EP.shots,SS=[];let TOTAL=0;SH.forEach((s,i)=>{SS[i]=TOTAL;TOTAL+=s.dur;});
let SI=0;
const P2=n=>String(n).padStart(2,'0');

/* world-space text with a minimum on-screen size */
function wt(x,y,t,size,col,weight,align,font,base){
  t=tr(t);const k=fit*cam.s,sz=Math.max(size,9.5/k);
  ctx.font=`${weight||500} ${sz}px ${font||FONT}`;ctx.textAlign=align||'left';ctx.textBaseline=base||'alphabetic';
  ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function wtw(t,size,weight,font){t=tr(t);const k=fit*cam.s,sz=Math.max(size,9.5/k);ctx.font=`${weight||500} ${sz}px ${font||FONT}`;return ctx.measureText(t).width;}
function arrow(x0,y0,x1,y1,col,lw,hs){
  lw=lw||2;hs=hs||lw*4+2;const a=Math.atan2(y1-y0,x1-x0);
  ln([x0,y0,x1-Math.cos(a)*hs*.6,y1-Math.sin(a)*hs*.6],col,lw);
  poly([x1,y1,x1-Math.cos(a-.42)*hs,y1-Math.sin(a-.42)*hs,x1-Math.cos(a+.42)*hs,y1-Math.sin(a+.42)*hs],col);
}
function tag(x,y,t,o){ // filled pill in world coords
  o=o||{};const size=o.size||20,pad=size*.55,w=wtw(t,size,o.weight||700)+pad*2,h=size*1.75;
  let bx=o.align==='center'?x-w/2:o.align==='right'?x-w:x;
  rrp(bx,y-h/2,w,h,o.r===undefined?h/2:o.r);ctx.fillStyle=o.bg||'#f2c230';ctx.fill();
  wt(bx+pad,y+1,t,size,o.fg||'#13232e',o.weight||700,'left',FONT,'middle');return w;
}
function card(x,y,w,h,o){o=o||{};rrp(x,y,w,h,o.r||14);ctx.fillStyle=o.bg||'rgba(255,255,255,.06)';ctx.fill();if(o.st!==false){ctx.strokeStyle=o.st||'rgba(255,255,255,.16)';ctx.lineWidth=o.lw||1.4;ctx.stroke();}}
function diagBG(){
  applyCam({x:800,y:450,s:1});
  ctx.fillStyle='#0e2a3b';ctx.fillRect(VX0,VY0,VX1-VX0,VY1-VY0);
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=50){ctx.moveTo(x,VY0);ctx.lineTo(x,VY1);}for(let y=0;y<=H;y+=50){ctx.moveTo(VX0,y);ctx.lineTo(VX1,y);}ctx.stroke();
}
function camMix(a,b,k){return {x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),s:lerp(a.s,b.s,k)};}
/* chart helper in world coords: axes box, returns mapper */
function chartBox(x,y,w,h,o){
  o=o||{};card(x,y,w,h,{bg:'rgba(7,27,39,.75)',r:12});
  const px=x+(o.pl||64),py=y+(o.pt||46),pw=w-(o.pl||64)-(o.pr||24),ph=h-(o.pt||46)-(o.pb||46);
  if(o.title)wt(x+18,y+32,o.title,20,'#f2c230',700);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.beginPath();
  const gx=o.gx||5,gy=o.gy||4;for(let i=0;i<=gx;i++){ctx.moveTo(px+pw*i/gx,py);ctx.lineTo(px+pw*i/gx,py+ph);}for(let i=0;i<=gy;i++){ctx.moveTo(px,py+ph*i/gy);ctx.lineTo(px+pw,py+ph*i/gy);}ctx.stroke();
  ln([px,py,px,py+ph,px+pw,py+ph],'rgba(255,255,255,.5)',1.4);
  const X=v=>px+pw*(v-o.x0)/(o.x1-o.x0),Y=v=>py+ph-ph*(v-o.y0)/(o.y1-o.y0);
  if(o.xl)wt(px+pw,py+ph+36,o.xl,16,'rgba(227,236,238,.7)',500,'right');
  if(o.yl)wt(px,py-12,o.yl,16,'rgba(227,236,238,.7)',500,'left');
  if(o.xt)o.xt.forEach(v=>wt(X(v),py+ph+20,String(v),16,'rgba(227,236,238,.75)',600,'center',COND));
  if(o.yt)o.yt.forEach(v=>wt(px-10,Y(v)+5,String(v),16,'rgba(227,236,238,.75)',600,'right',COND));
  return {X,Y,px,py,pw,ph};
}

/* ================= localisation of episode data ================= */
function epT(){return LANG==='en'?(EP.en||EP.t):tr(EP.t);}
function epSub(){return LANG==='en'?EP.t:(EP.en||'');}
function loc(i){const s=SH[i];
  if(LANG==='zh')return {t:s.t,sub:s.en||'',d:s.d,s:s.s};
  return {t:LANG==='en'?(s.en||tr(s.t)):tr(s.t),sub:LANG==='en'?s.t:(s.en||''),d:tr(s.d),s:s.s.map(x=>[x[0],tr(x[1])])};}
function seriesLine(){if(!EP.seriesName)return '';return ui(EP.total?'series':'seriesOne',{s:tr(EP.seriesName),n:EP.no,t:EP.total||''});}
function docTitle(){return EP.seriesName?`${P2(EP.no)} ${epT()}｜${tr(EP.seriesName)}`:epT();}

/* ================= frame ================= */
function renderFrame(){
  SI=0;while(SI<SH.length-1&&T>=SS[SI+1])SI++;
  const sh=SH[SI],u=clamp((T-SS[SI])/sh.dur);U=u;TT=T;
  screenSpace();ctx.clearRect(0,0,cssW,cssH);
  if(sh.side){applyCam(sh.cam?sh.cam(u):{x:800,y:450,s:1});(sh.base||EP.base||(typeof sideBase==='function'?sideBase:()=>{}))(u);if(sh.draw)sh.draw(u);(sh.end||EP.end||(typeof sideEnd==='function'?sideEnd:()=>{}))(u);if(sh.fx)sh.fx(u);}
  else{if(sh.cam)applyCam(sh.cam(u));else applyCam({x:800,y:450,s:1});sh.draw(u);}
  drawTicks();drawLabels();if(sh.hud)sh.hud(u);
  const tin=T-SS[SI],tout=SS[SI]+sh.dur-T;let fa=0;
  if(SI>0)fa=Math.max(fa,1-tin/.45);if(SI<SH.length-1)fa=Math.max(fa,1-tout/.45);
  if(fa>0){screenSpace();ctx.fillStyle=`rgba(4,14,22,${clamp(fa)*.92})`;ctx.fillRect(0,0,cssW,cssH);}
  if(T<3.2){ // opening title
