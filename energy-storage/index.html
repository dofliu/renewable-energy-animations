<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title data-zh="儲能系列｜再生能源動畫館" data-en="Energy Storage series｜Renewable Energy Animations" data-ja="エネルギー貯蔵シリーズ｜再生可能エネルギー・アニメーション館">儲能系列｜再生能源動畫館</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌊%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e7eeec;--surface:#f6f9f8;--ink:#13232e;--muted:#4f6470;--line:#c5d3d2;--sea:#1f7f99;--signal:#f2c230;--chart:#0e2a3b;--sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--cond:"Barlow Condensed","Arial Narrow",sans-serif}

.topic .body{padding:14px 16px 16px}.topic b{font-size:20px;display:block}.topic p{margin:4px 0 10px;color:var(--muted);font-size:14px}.topic .meta{font-family:var(--cond);font-weight:600;color:var(--sea);font-size:15px}.masthead2{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.langsw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:36px;background:var(--surface)}.langsw button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:0 12px;cursor:pointer}.langsw button+button{border-left:1px solid var(--line)}.langsw button[aria-pressed="true"]{background:var(--chart);color:#fff}.langsw button:focus-visible{outline:3px solid var(--signal);outline-offset:-3px}</style></head><body><div class="wrap"><div class="masthead2"><p class="crumb"><a href="../index.html">← <span data-zh="再生能源動畫館" data-en="Renewable Energy Animations" data-ja="再生可能エネルギー・アニメーション館">再生能源動畫館</span></a></p><div class="langsw" role="group" aria-label="Language"><button type="button" data-lang="zh" lang="zh-Hant">中文</button><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="ja" lang="ja">日本語</button></div></div><h1><span data-zh="儲能系列" data-en="Energy Storage series" data-ja="エネルギー貯蔵シリーズ">儲能系列</span></h1><p class="lede" data-zh="再生能源越多，電網越需要能「存電」的設備。這個系列從貨櫃式電池儲能談起，看儲能如何充放電、如何保持安全，又如何幫台灣電網穩住頻率。" data-en="The more renewables on the grid, the more it needs ways to store electricity. This series starts with containerized battery storage: how it charges and discharges, how it is kept safe, and how it helps Taiwan&#x27;s grid hold its frequency." data-ja="再生可能エネルギーが増えるほど、電力系統には電気を蓄える設備が必要になります。本シリーズはコンテナ型蓄電池から始め、充放電の仕組み、安全の確保、そして台湾の電力系統の周波数を支える役割を解説します。">再生能源越多，電網越需要能「存電」的設備。這個系列從貨櫃式電池儲能談起，看儲能如何充放電、如何保持安全，又如何幫台灣電網穩住頻率。</p>
<h2><span data-zh="設備與原理" data-en="Equipment and principles" data-ja="設備と原理">設備與原理</span></h2>
<a class="ep" href="ep01.html"><span class="n">01</span><span class="t"><b data-zh="貨櫃式電池儲能系統" data-en="Containerized battery energy storage" data-ja="コンテナ型蓄電池システム">貨櫃式電池儲能系統</b><i data-zh="電池芯到貨櫃、BMS／PCS／EMS、液冷與消防、調頻輔助服務" data-en="Cells to containers, BMS/PCS/EMS, liquid cooling and fire safety, frequency regulation" data-ja="セルからコンテナ、BMS／PCS／EMS、液冷と防火、周波数調整">電池芯到貨櫃、BMS／PCS／EMS、液冷與消防、調頻輔助服務</i></span><span class="d">1:32</span></a>

<p class="foot" data-zh="教育用途示意動畫，數值為典型範例；實際依各案設計與主管機關核定內容而定。" data-en="Educational schematic animations; figures are typical examples. Actual values depend on each project&#x27;s design and the authorities&#x27; approvals." data-ja="教育用の模式アニメーションです。数値は典型的な例で、実際は各案件の設計と主管機関の承認内容によります。">教育用途示意動畫，數值為典型範例；實際依各案設計與主管機關核定內容而定。</p><p class="foot" data-zh="© 2026 國立勤益科技大學 智慧自動化工程系 劉瑞弘老師研究室 製作" data-en="© 2026 Produced by Prof. Liu&#x27;s Lab, Department of Intelligent Automation Engineering, National Chin-Yi University of Technology" data-ja="© 2026 制作：国立勤益科技大学 スマートオートメーション工学科 劉瑞弘研究室">© 2026 國立勤益科技大學 智慧自動化工程系 劉瑞弘老師研究室 製作</p></div><script>(function(){var K='rea-lang',LS=['zh','en','ja'];

function apply(l){document.querySelectorAll('[data-zh]').forEach(function(el){var v=el.getAttribute('data-'+l);el.textContent=v||el.getAttribute('data-zh');});
 var t=document.querySelector('title[data-zh]');if(t)document.title=t.getAttribute('data-'+l)||t.getAttribute('data-zh');

 document.querySelectorAll('.langsw [data-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===l?'true':'false');});}
