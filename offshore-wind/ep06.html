<html lang="zh-Hant-TW">

<title>06 轉接段安裝：離岸風場開發深入動畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e7eeec;
  --surface:#f6f9f8;
  --ink:#13232e;
  --muted:#4f6470;
  --line:#c5d3d2;
  --chart:#0e2a3b;
  --signal:#f2c230;
  --alert:#e8572a;
  --sea:#1f7f99;
  --stepdone:#1f7f99;
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Noto Sans TC","PingFang TC",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08202d;--surface:#0e2a3b;--ink:#e3ecee;--muted:#93aab4;--line:#1f4254;--stepdone:#58b8d0;--sea:#58b8d0;
  }
}
:root[data-theme="dark"]{--bg:#08202d;--surface:#0e2a3b;--ink:#e3ecee;--muted:#93aab4;--line:#1f4254;--stepdone:#58b8d0;--sea:#58b8d0;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:18px clamp(12px,3vw,32px) 48px}

/* ---------- title ---------- */
.masthead{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;margin:6px 0 16px}
.masthead .mark{grid-row:span 2;width:58px;height:58px;border-radius:14px;background:var(--chart);display:grid;place-items:center}
.masthead .mark svg{width:40px;height:40px}
.masthead h1{margin:0;font-size:clamp(24px,3.4vw,38px);font-weight:900;letter-spacing:.02em;line-height:1.15}
.masthead p{margin:0;color:var(--muted);font-size:clamp(13px,1.5vw,15px);max-width:62ch}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--chart);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(8,32,45,.55)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;display:grid;place-items:center;background:#051620}
.stage:fullscreen canvas{position:relative;inset:auto;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
.chapcard{position:absolute;left:clamp(10px,2vw,22px);top:clamp(10px,2vw,20px);display:flex;align-items:stretch;gap:12px;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s}
.chapcard.show{opacity:1;transform:none}
.chapcard .no{font-family:var(--cond);font-weight:700;font-size:clamp(30px,4.6vw,58px);line-height:.9;color:var(--signal);text-shadow:0 2px 12px rgba(0,0,0,.35)}
.chapcard .tt{display:flex;flex-direction:column;justify-content:center;padding-left:12px;border-left:3px solid var(--signal)}
.chapcard b{font-size:clamp(15px,2.1vw,26px);font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45);line-height:1.2}
.chapcard i{font-style:normal;font-family:var(--cond);font-weight:500;font-size:clamp(12px,1.35vw,17px);color:rgba(255,255,255,.82);letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.caption{position:absolute;left:50%;bottom:clamp(8px,1.8vw,20px);transform:translateX(-50%);max-width:min(88%,760px);background:rgba(7,26,37,.78);color:#f2f6f7;border-radius:10px;padding:7px 16px;font-size:clamp(12px,1.5vw,17px);font-weight:500;text-align:center;pointer-events:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .35s}
.caption:empty{opacity:0}
.caption .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--signal);margin-right:8px;vertical-align:middle;transform:translateY(-1px)}
.scale-note{position:absolute;right:12px;top:10px;font-size:11px;color:rgba(255,255,255,.62);pointer-events:none}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);height:40px;min-width:40px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;font:inherit;font-size:14px;padding:0 10px}
.btn:hover{border-color:var(--sea)}
.btn:focus-visible,.seg button:focus-visible,.chap:focus-visible,.timeline:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn svg{width:18px;height:18px}
.btn.play{background:var(--chart);color:#fff;border-color:var(--chart);min-width:48px}
.timeline{position:relative;flex:1 1 320px;height:40px;display:flex;align-items:center;cursor:pointer;touch-action:none;border-radius:8px}
.tl-track{position:relative;display:flex;width:100%;height:12px;border-radius:3px;overflow:hidden;background:var(--line)}
.tl-seg{height:100%;border-right:2px solid var(--bg);position:relative}
.tl-seg:nth-child(odd){background:rgba(19,35,46,.10)}
.tl-seg:last-child{border-right:0}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:var(--chart);pointer-events:none}
:root[data-theme="dark"] .tl-fill{background:var(--sea)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl-fill{background:var(--sea)}}
.tl-head{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--signal);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
.time{font-family:var(--cond);font-weight:600;font-size:16px;color:var(--muted);min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:40px;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--cond);font-weight:600;font-size:15px;padding:0 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chart);color:#fff}
.btn.toggle[aria-pressed="false"]{color:var(--muted)}

/* ---------- info ---------- */
.info{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.info h2{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:900;line-height:1.25;display:flex;align-items:baseline;gap:12px}
.info h2 .n{font-family:var(--cond);font-weight:700;color:var(--sea);font-size:1.15em}
.info .en{margin:2px 0 12px;font-family:var(--cond);font-size:18px;font-weight:500;color:var(--muted)}
.info .desc{margin:0;font-size:16px;line-height:1.85;max-width:44em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:0;list-style:none}
.chips li{font-size:13px;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.steps{list-style:none;margin:0;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;counter-reset:s}
.steps h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.steps li{position:relative;padding:8px 0 8px 34px;font-size:15px;color:var(--muted);border-top:1px dashed var(--line);counter-increment:s;transition:color .3s}
.steps li:first-of-type{border-top:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:13px;color:var(--muted);background:var(--surface)}
.steps li.done{color:var(--ink)}
.steps li.done::before{content:"✓";background:var(--stepdone);border-color:var(--stepdone);color:#fff}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{background:var(--signal);border-color:var(--signal);color:#13232e}

/* ---------- chapter index ---------- */
.chapters{margin-top:28px}
.chapters h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chap{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;display:flex;gap:10px;align-items:center;min-height:48px}
.chap .n{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--muted);min-width:24px}
.chap .t{font-size:14px;line-height:1.3}
.chap:hover{border-color:var(--sea)}
.chap.active{background:var(--chart);border-color:var(--chart);color:#fff}
.chap.active .n{color:var(--signal)}
.chap.past .n{color:var(--sea)}
.foot{margin-top:28px;font-size:13px;color:var(--muted);max-width:80ch;line-height:1.7}

@media (max-width:820px){
  .info{grid-template-columns:1fr;gap:18px}
  .masthead .mark{width:46px;height:46px;border-radius:12px}
  .masthead .mark svg{width:32px;height:32px}
  .scale-note{display:none}
  .stage{border-radius:12px}
}
@media (max-width:560px){
  .chapcard{gap:8px}
  .chapcard .tt{padding-left:8px;border-left-width:2px}
  .caption{padding:5px 10px;border-radius:8px}
  .time{min-width:0;font-size:14px}
  .seg button{padding:0 8px}
}
@media (prefers-reduced-motion:reduce){
  .chapcard,.caption{transition:none}
}
.masthead .series{margin:0;font-size:13px;color:var(--muted);font-weight:500}
.masthead .series a{color:inherit}
.shots{margin-top:28px}
.shots h3,.facts h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.facts{margin-top:28px}
.fact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact dt{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1;color:var(--ink)}
.fact dt small{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--sea);margin-left:4px}
.fact dd{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.55}
.chapcard .no small{font-size:.45em;color:rgba(255,255,255,.75);margin-left:4px;font-weight:600}

</style>

<script>
/* ================= utilities ================= */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeOut=t=>{t=clamp(t);return 1-Math.pow(1-t,3);};
const easeIn=t=>{t=clamp(t);return t*t*t;};
const seg=(u,a,b)=>clamp((u-a)/(b-a));
const lerpPt=(a,b,t)=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)});
function kf(u,pts){
  if(u<=pts[0][0]) return {x:pts[0][1],y:pts[0][2]};
  for(let i=1;i<pts.length;i++){
    if(u<=pts[i][0]){const a=pts[i-1],b=pts[i];const t=ease((u-a[0])/(b[0]-a[0]||1));return {x:lerp(a[1],b[1],t),y:lerp(a[2],b[2],t)};}
  }
  const l=pts[pts.length-1];return {x:l[1],y:l[2]};
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const nz=x=>Math.sin(x*1.7)*.5+Math.sin(x*3.1+1.3)*.3+Math.sin(x*7.3+.7)*.2;

/* ================= world geometry ================= */
const W=1600,H=900,SEA=470,TX=640,OX=1120,COAST=1455;
const bedBase=x=>702+6*Math.sin(x*.013)+4*Math.sin(x*.031+1);
function bedY(x){
  if(x<1180) return bedBase(x);
  if(x<COAST){const k=(x-1180)/(COAST-1180);const s=k*k*(3-2*k);return lerp(bedBase(1180),SEA+6,s);}
  return Math.max(440,SEA+6-(x-COAST)*.5);
}
const wv=(x,t)=>SEA+2.4*Math.sin(x*.021-t*1.7)+1.5*Math.sin(x*.047+t*1.2);
const bedTX=bedY(TX),bedOX=bedY(OX);
const PILE_TOP=460,PILE_W=30,PILE_BOT=bedTX+130,PILE_L=PILE_BOT-PILE_TOP;
const TP_TOP=420,TP_BOT=478,TP_H=58;
const TW_TOP=185,HS=(TP_TOP-TW_TOP)/3;
const tw=y=>lerp(16,26,(y-TW_TOP)/(TP_TOP-TW_TOP));
const HUB={x:TX-44,y:TW_TOP-20},BR=165;
const JH=bedOX-440;
const LAY=[{a:0,b:36,c:'#d9c393',n:'細砂層',m:'0–7 m'},{a:36,b:92,c:'#a4876a',n:'粉土質黏土',m:'7–18 m'},{a:92,b:152,c:'#c4a678',n:'緊密砂層',m:'18–30 m'},{a:152,b:760,c:'#6d6862',n:'岩盤／極緊密層',m:'> 30 m'}];
const WRECK_X=250,UXO_X=560;
const HDD_EXIT=1350;


/* ================= canvas, camera, labels ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let dpr=1,cssW=960,cssH=540,fit=.6;
let cam={x:800,y:450,s:1},VX0=0,VX1=W,VY0=0,VY1=H;
let T=0,TT=0,CUR=0,U=0,SHOWLAB=true;
const FONT='"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const COND='"Barlow Condensed","Arial Narrow","Noto Sans TC","Noto Sans CJK TC",sans-serif';
const TAU=Math.PI*2;

function applyCam(c){
  cam=c;const k=fit*c.s;
  ctx.setTransform(dpr*k,0,0,dpr*k,dpr*(cssW/2-c.x*k),dpr*(cssH/2-c.y*k));
  VX0=c.x-cssW/2/k-6;VX1=c.x+cssW/2/k+6;VY0=c.y-cssH/2/k-6;VY1=c.y+cssH/2/k+6;
}
function toScreen(x,y){const k=fit*cam.s;return {x:cssW/2+(x-cam.x)*k,y:cssH/2+(y-cam.y)*k};}
function screenSpace(){ctx.setTransform(dpr,0,0,dpr,0,0);}

const LQ=[];
function lab(x,y,text,o){
  o=o||{};if(!SHOWLAB)return;const a=o.a===undefined?1:o.a;if(a<=.01)return;
  LQ.push({x,y,text,dx:o.dx===undefined?0:o.dx,dy:o.dy===undefined?-40:o.dy,a,st:o.st||'n',minor:!!o.minor});
}
function drawLabels(){
  screenSpace();
  const f=clamp(cssW/100,10,13.5),sc=clamp(cssW/1100,.6,1.15);
  ctx.font=`500 ${f}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';
  for(const L of LQ){
    if(L.minor&&cssW<760)continue;
    const p=toScreen(L.x,L.y),qx=p.x+L.dx*sc,qy=p.y+L.dy*sc;
    if(p.x<-8||p.x>cssW+8||p.y<-8||p.y>cssH+8)continue;
    ctx.globalAlpha=L.a;
    const tw=ctx.measureText(L.text).width,ph=f*1.8,pw=tw+f*1.2;
    let bx,by;
    if(L.dy===0){bx=L.dx>=0?qx:qx-pw;by=qy-ph/2;}
    else{bx=qx-pw/2;by=L.dy<0?qy-ph:qy;}
    bx=clamp(bx,4,cssW-pw-4);by=clamp(by,4,cssH-ph-4);
    if(L.dx||L.dy){
      const ex=clamp(qx,bx,bx+pw),ey=clamp(qy,by,by+ph);
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.3;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,TAU);ctx.fillStyle='#fff';ctx.fill();

/* ================= episode engine ================= */
const hn=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);};
const SH=EP.shots,SS=[];let TOTAL=0;SH.forEach((s,i)=>{SS[i]=TOTAL;TOTAL+=s.dur;});
let SI=0;
const P2=n=>String(n).padStart(2,'0');

/* world-space text with a minimum on-screen size */
function wt(x,y,t,size,col,weight,align,font,base){
  const k=fit*cam.s,sz=Math.max(size,9.5/k);
  ctx.font=`${weight||500} ${sz}px ${font||FONT}`;ctx.textAlign=align||'left';ctx.textBaseline=base||'alphabetic';
  ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function wtw(t,size,weight,font){const k=fit*cam.s,sz=Math.max(size,9.5/k);ctx.font=`${weight||500} ${sz}px ${font||FONT}`;return ctx.measureText(t).width;}
function arrow(x0,y0,x1,y1,col,lw,hs){
  lw=lw||2;hs=hs||lw*4+2;const a=Math.atan2(y1-y0,x1-x0);
  ln([x0,y0,x1-Math.cos(a)*hs*.6,y1-Math.sin(a)*hs*.6],col,lw);
  poly([x1,y1,x1-Math.cos(a-.42)*hs,y1-Math.sin(a-.42)*hs,x1-Math.cos(a+.42)*hs,y1-Math.sin(a+.42)*hs],col);
}
function tag(x,y,t,o){ // filled pill in world coords
  o=o||{};const size=o.size||20,pad=size*.55,w=wtw(t,size,o.weight||700)+pad*2,h=size*1.75;
  let bx=o.align==='center'?x-w/2:o.align==='right'?x-w:x;
  rrp(bx,y-h/2,w,h,o.r===undefined?h/2:o.r);ctx.fillStyle=o.bg||'#f2c230';ctx.fill();
  wt(bx+pad,y+1,t,size,o.fg||'#13232e',o.weight||700,'left',FONT,'middle');return w;
}
function card(x,y,w,h,o){o=o||{};rrp(x,y,w,h,o.r||14);ctx.fillStyle=o.bg||'rgba(255,255,255,.06)';ctx.fill();if(o.st!==false){ctx.strokeStyle=o.st||'rgba(255,255,255,.16)';ctx.lineWidth=o.lw||1.4;ctx.stroke();}}
function diagBG(){
  applyCam({x:800,y:450,s:1});
  ctx.fillStyle='#0e2a3b';ctx.fillRect(VX0,VY0,VX1-VX0,VY1-VY0);
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=50){ctx.moveTo(x,VY0);ctx.lineTo(x,VY1);}for(let y=0;y<=H;y+=50){ctx.moveTo(VX0,y);ctx.lineTo(VX1,y);}ctx.stroke();
}
function sideBase(){
  drawSky();drawWaterBack();drawSoil();
  for(const [x,s] of [[1476,.8],[1490,1],[1506,.9],[1612,.9],[1664,1.1],[1690,.8],[1720,1]])if(x>VX0-20&&x<VX1+20)tree(x,s);
  if(VX1>1600)drawPylon();
}
function sideEnd(){soilVeil(VX0,VX1,.24);drawWaterOver();}
function camMix(a,b,k){return {x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),s:lerp(a.s,b.s,k)};}
/* chart helper in world coords: axes box, returns mapper */
function chartBox(x,y,w,h,o){
  o=o||{};card(x,y,w,h,{bg:'rgba(7,27,39,.75)',r:12});
  const px=x+(o.pl||64),py=y+(o.pt||46),pw=w-(o.pl||64)-(o.pr||24),ph=h-(o.pt||46)-(o.pb||46);
  if(o.title)wt(x+18,y+32,o.title,20,'#f2c230',700);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.beginPath();
  const gx=o.gx||5,gy=o.gy||4;for(let i=0;i<=gx;i++){ctx.moveTo(px+pw*i/gx,py);ctx.lineTo(px+pw*i/gx,py+ph);}for(let i=0;i<=gy;i++){ctx.moveTo(px,py+ph*i/gy);ctx.lineTo(px+pw,py+ph*i/gy);}ctx.stroke();
  ln([px,py,px,py+ph,px+pw,py+ph],'rgba(255,255,255,.5)',1.4);
  const X=v=>px+pw*(v-o.x0)/(o.x1-o.x0),Y=v=>py+ph-ph*(v-o.y0)/(o.y1-o.y0);
  if(o.xl)wt(px+pw,py+ph+36,o.xl,16,'rgba(227,236,238,.7)',500,'right');
  if(o.yl)wt(px,py-12,o.yl,16,'rgba(227,236,238,.7)',500,'left');
  if(o.xt)o.xt.forEach(v=>wt(X(v),py+ph+20,String(v),16,'rgba(227,236,238,.75)',600,'center',COND));
  if(o.yt)o.yt.forEach(v=>wt(px-10,Y(v)+5,String(v),16,'rgba(227,236,238,.75)',600,'right',COND));
  return {X,Y,px,py,pw,ph};
}

/* ================= frame ================= */
function renderFrame(){
  SI=0;while(SI<SH.length-1&&T>=SS[SI+1])SI++;
  const sh=SH[SI],u=clamp((T-SS[SI])/sh.dur);U=u;TT=T;
  screenSpace();ctx.clearRect(0,0,cssW,cssH);
  if(sh.side){applyCam(sh.cam?sh.cam(u):{x:800,y:450,s:1});sideBase();if(sh.draw)sh.draw(u);sideEnd();if(sh.fx)sh.fx(u);}
  else{if(sh.cam)applyCam(sh.cam(u));else applyCam({x:800,y:450,s:1});sh.draw(u);}
  drawTicks();drawLabels();if(sh.hud)sh.hud(u);
  const tin=T-SS[SI],tout=SS[SI]+sh.dur-T;let fa=0;
  if(SI>0)fa=Math.max(fa,1-tin/.45);if(SI<SH.length-1)fa=Math.max(fa,1-tout/.45);
  if(fa>0){screenSpace();ctx.fillStyle=`rgba(4,14,22,${clamp(fa)*.92})`;ctx.fillRect(0,0,cssW,cssH);}
  if(T<3.2){ // opening title
    const a=T<2.3?1:1-(T-2.3)/.9;screenSpace();ctx.fillStyle=`rgba(5,22,32,${.82*a})`;ctx.fillRect(0,0,cssW,cssH);
    ctx.globalAlpha=a;const fs=clamp(cssW/20,22,64);ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.font=`700 ${fs*1.3}px ${COND}`;ctx.fillStyle='#f2c230';ctx.fillText(P2(EP.no),cssW/2,cssH*.43);
    ctx.font=`900 ${fs}px ${FONT}`;ctx.fillStyle='#fff';ctx.fillText(EP.t,cssW/2,cssH*.43+fs*1.2);
    ctx.font=`500 ${fs*.42}px ${COND}`;ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText(EP.en,cssW/2,cssH*.43+fs*1.85);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
}

  SH.forEach((c,i)=>{const b=document.createElement('button');b.className='chap';b.type='button';b.innerHTML=`<span class="n">${i+1}</span><span class="t">${c.t}</span>`;b.addEventListener('click',()=>{jump(SS[i]+.001);if(!playing&&!ended){}});grid.appendChild(b);});
  const btns=[...grid.children];
  $('facts').innerHTML=EP.facts.map(f=>`<div class="fact"><dt>${f[0]}<small>${f[1]}</small></dt><dd>${f[2]}</dd></div>`).join('');
  $('foot').textContent=EP.note;

  function resize(){const r=cv.getBoundingClientRect();if(r.width<2)return;cssW=r.width;cssH=r.height;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);fit=cssW/W;dirty=true;}
  if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);else window.addEventListener('resize',resize);
  resize();
  function setPlayIcon(){
    playIcon.innerHTML=playing?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':(ended?'<path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.7A5 5 0 1 0 12 7v3L7.5 6 12 2z"/>':'<path d="M7 4.5v15l12-7.5z"/>');
    bPlay.setAttribute('aria-label',playing?'暫停':(ended?'重新播放':'播放'));
  }
  function jump(t){T=clamp(t,0,TOTAL-.001);ended=false;dirty=true;setPlayIcon();}
  function togglePlay(){if(ended){T=0;ended=false;playing=true;}else playing=!playing;setPlayIcon();dirty=true;}
  bPlay.addEventListener('click',togglePlay);
  const idx=()=>{let c=0;while(c<SH.length-1&&T>=SS[c+1])c++;return c;};
  $('bPrev').addEventListener('click',()=>{const c=idx();jump(T-SS[c]>1.5?SS[c]+.001:SS[Math.max(0,c-1)]+.001);});
  $('bNext').addEventListener('click',()=>{const c=idx();if(c<SH.length-1)jump(SS[c+1]+.001);else jump(TOTAL-.01);});
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{speed=+b.dataset.speed;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));}));
  const bLab=$('bLabels');bLab.addEventListener('click',()=>{SHOWLAB=!SHOWLAB;bLab.setAttribute('aria-pressed',SHOWLAB?'true':'false');dirty=true;});
  $('bFull').addEventListener('click',()=>{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}else{const f=stage.requestFullscreen||stage.webkitRequestFullscreen;if(f)f.call(stage);}});
  document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
  function tlFrac(e){const r=track.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width);}
  tl.addEventListener('pointerdown',e=>{dragging=true;wasPlaying=playing;playing=false;tl.setPointerCapture(e.pointerId);jump(tlFrac(e)*TOTAL);});
  tl.addEventListener('pointermove',e=>{if(dragging)jump(tlFrac(e)*TOTAL);});
  const endDrag=()=>{if(!dragging)return;dragging=false;playing=wasPlaying;setPlayIcon();};
  tl.addEventListener('pointerup',endDrag);tl.addEventListener('pointercancel',endDrag);
  tl.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){jump(T-5);e.preventDefault();e.stopPropagation();}
    else if(e.key==='ArrowRight'){jump(T+5);e.preventDefault();e.stopPropagation();}
    else if(e.key==='Home'){jump(0);e.preventDefault();}else if(e.key==='End'){jump(TOTAL-.01);e.preventDefault();}
  });
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
    if(e.key===' '||e.code==='Space'){if(tag==='button')return;e.preventDefault();togglePlay();}
    else if(e.key==='ArrowLeft'&&e.target!==tl){$('bPrev').click();}else if(e.key==='ArrowRight'&&e.target!==tl){$('bNext').click();}
  });
  function updateUI(){
    const c=SI,sh=SH[c],f=T/TOTAL*100;
    fill.style.width=f+'%';head.style.left=f+'%';
    tl.setAttribute('aria-valuenow',Math.round(f));tl.setAttribute('aria-valuetext',`分鏡 ${c+1} ${sh.t}，${fmt(T)}`);
    timeEl.textContent=fmt(T)+' / '+fmt(TOTAL);
    if(c!==prevC){
      prevC=c;prevStep=-2;cardEl.classList.remove('show');
      setTimeout(()=>{$('ccNo').innerHTML=`${P2(EP.no)}<small>${c+1}／${SH.length}</small>`;$('ccT').textContent=sh.t;$('ccE').textContent=sh.en||'';cardEl.classList.add('show');},reduce?0:180);
      $('iNo').textContent=c+1;$('iT').textContent=sh.t;$('iE').textContent=sh.en||'';$('iD').textContent=sh.d;
      $('iS').innerHTML=sh.s.map(s=>`<li>${s[1]}</li>`).join('');
      btns.forEach((b,i)=>{b.classList.toggle('active',i===c);b.classList.toggle('past',i<c);if(i===c)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
    }
    let si=0;sh.s.forEach((s,i)=>{if(U>=s[0])si=i;});
    if(si!==prevStep){prevStep=si;cap.innerHTML=`<span class="dot"></span>${sh.s[si][1]}`;[...$('iS').children].forEach((li,i)=>{li.className=i<si?'done':i===si?'now':'';});}
  }
  function loop(ts){
    const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;
    if(playing&&!ended){T+=dt*speed;if(T>=TOTAL){T=TOTAL-.001;ended=true;playing=false;setPlayIcon();}dirty=true;}
    if(dirty&&cssW>2){renderFrame();updateUI();dirty=false;}
    requestAnimationFrame(loop);
  }
  setPlayIcon();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true;});
  window.__ow={seek:t=>{T=t;dirty=true;},pause:()=>{playing=false;setPlayIcon();},shot:i=>{T=SS[i]+.5;dirty=true;},get T(){return T;},SS,TOTAL};
  requestAnimationFrame(loop);
})();

</script>
</body>
